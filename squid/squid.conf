# Squid as an egress proxy: workloads on the private network may reach the allow-listed domains, and nothing else.
http_port 3128

# Who may use the proxy: only the private network
acl private_net src 172.30.0.0/16

# Where they may go: only the domains in the allow list (HTTPS is checked by the CONNECT hostname, never decrypted)
acl allowed_domains dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
# DEMO: "temporary" rule to unblock a team quickly
http_access allow private_net
http_access allow private_net allowed_domains
http_access deny all

# A pass-through proxy, not a cache, that doesn't leak client details
cache deny all
via off
forwarded_for delete
httpd_suppress_version_string on

# One line per request, so every allowed and denied request is on record
logformat egress %ts.%03tu %>a %Ss/%03>Hs %rm %ru
access_log stdio:/dev/stdout egress
cache_log stdio:/dev/stderr
pid_filename /run/squid/squid.pid
