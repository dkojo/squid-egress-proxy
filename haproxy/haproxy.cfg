# One proxy address for the workloads (egress:3128), spread across two Squid instances.
# If one fails its health check, traffic carries on through the other.
global
    stats socket ipv4@0.0.0.0:9999 level admin

defaults
    mode tcp
    timeout connect 3s
    timeout client 60s
    timeout server 60s

frontend egress
    bind :3128
    default_backend squids

backend squids
    balance roundrobin
    server squid1 squid1:3128 check inter 1s fall 2 rise 2
    server squid2 squid2:3128 check inter 1s fall 2 rise 2
